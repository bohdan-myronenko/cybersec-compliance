networks:
  public:
    driver: bridge
  private:
    driver: bridge

services:
  webui:
    build: ./services/webui
    container_name: webui
    env_file: .env
    ports:
      - "8501:8501"
    networks:
      - public
      - private
    environment:
      API_URL: http://api:8080
      OUT_DIR: /out
      DATA_DIR: /data
    depends_on:
      - api
    volumes:
      - ./out:/out:ro
      - ./data:/data:ro

  api:
    build: ./services/api
    container_name: api
    env_file: .env
    ports:
      - "8080:8080"
    networks:
      - public
      - private
    environment:
      WORKER_URL: http://worker:8081
      REDIS_URL: redis://redis:6379
    depends_on:
      - worker
      - ollama
      - redis
    volumes:
      - ./warehouse:/app/warehouse
      - ./kb:/app/kb:ro
      - ./index:/app/index
      - ./out:/app/out
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]

  worker:
    build: ./services/worker
    container_name: compliance_worker
    env_file: .env
    networks:
      - private
    expose:
      - "8081"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - ollama
      - redis
    volumes:
      - ./warehouse:/app/warehouse
      - ./kb:/kb:rw
      - ./index:/app/index
      - ./out:/out:rw
      - ./data:/data:rw
    command: ["python", "-m", "app.run_worker"]
    
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks:
      - private
    expose:
      - "11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - private
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  ollama: {}
  redis_data: {}